script:
  - [TEXT, "After a series of epic battles,"]
  - [LINE_BREAK, 6]
  - [TEXT, "Richter Belmont finally succeeded"]
  - [LINE_BREAK, 15]
  - [TEXT, "in destroying Count Dracula,"]
  - [LINE_BREAK, 9]
  - [TEXT, "the ancient vampire who had been"]
  - [LINE_BREAK, 14]
  - [TEXT, "most recently resurrected by"]
  - [LINE_BREAK, 22]
  - [TEXT, "the dark priest, Shaft."]
  - [PARAGRAPH_BREAK, 8]
  - [TEXT, "However, one night 4 years later,"]
  - [LINE_BREAK, 6]
  - [TEXT, "under the bright glare of the moon,"]
  - [LINE_BREAK, 11]
  - [TEXT, "Richter mysteriously vanished."]
  - [PARAGRAPH_BREAK, 12]
  - [TEXT, "With no idea of where to begin"]
  - [LINE_BREAK, 5]
  - [TEXT, "her search, Maria Renard set out to"]
  - [LINE_BREAK, 37]
  - [TEXT, "look for him. "]
  - [LINE_BREAK, 8]
  - [TEXT, "It was then that fate intervened."]
  - [PARAGRAPH_BREAK, 5]
  - [TEXT, "Castlevania, the castle of Dracula,"]
  - [LINE_BREAK, 3]
  - [TEXT, "which is rumored to appear only once"]
  - [LINE_BREAK, 15]
  - [TEXT, "every century, suddenly and"]
  - [LINE_BREAK, 17]
  - [TEXT, "mysteriously materialized."]
  - [PARAGRAPH_BREAK, 16]
  - [TEXT, "Meanwhile, powerful forces"]
  - [LINE_BREAK, 17]
  - [TEXT, "were at work in the life of"]
  - [LINE_BREAK, 27]
  - [TEXT, "a man named Alucard."]
  - [PARAGRAPH_BREAK, 13]
  - [TEXT, "The very same Alucard who had"]
  - [LINE_BREAK, 18]
  - [TEXT, "previously teamed up with"]
  - [LINE_BREAK, 16]
  - [TEXT, "Ralph C. Belmont to destroy"]
  - [LINE_BREAK, 10]
  - [TEXT, "his immortal father, Vlad Tepes"]
  - [LINE_BREAK, 29]
  - [TEXT, "aka Count Dracula."]
  - [PARAGRAPH_BREAK, 2]
  - [TEXT, "Alucard, in order to rid the world of"]
  - [LINE_BREAK, 20]
  - [TEXT, "his own cursed blood line,"]
  - [LINE_BREAK, 7]
  - [TEXT, "sealed off his powers and entered"]
  - [LINE_BREAK, 15]
  - [TEXT, "into what was supposed to be"]
  - [LINE_BREAK, 28]
  - [TEXT, "an eternal slumber."]
  - [PARAGRAPH_BREAK, 0]
  - [TEXT, "But now, that sleep has been disturbed"]
  - [LINE_BREAK, 2]
  - [TEXT, "and Alucard is aware of the evil that"]
  - [LINE_BREAK, 3]
  - [TEXT, "is once again arisen in his homeland."]
  - [PARAGRAPH_BREAK, 11]
  - [TEXT, "The time has come once more for"]
  - [LINE_BREAK, 12]
  - [TEXT, "the forces of Good and Evil to"]
  - [LINE_BREAK, 11]
  - [TEXT, "engage in their ancient battle."]
  - [LINE_BREAK, 6]
  - [TEXT, "Dracula's castle beckons for you..."]
  - [PARAGRAPH_BREAK, 3]
  - [TEXT, "And perhaps none but that bright and"]
  - [LINE_BREAK, 1]
  - [TEXT, "glaring moon can say who will triumph."]
  - [END]
